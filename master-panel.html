<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Личный кабинет</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="panel">

<header class="header master-header">
  <img class="logo" src="img/лого.png">
  <h1 class="master-title">Личный кабинет — <span id="masterName">Мастер</span>
  </h1>
  <div class="master-right">
    <div class="notif-wrapper">
      <button class="notif-btn" id="openNotifBtn">🔔</button>
      <span id="notifCount" class="notif-badge">0</span>
    </div>

    <div id="notifPanel" class="notif-panel">
      <div class="notif-panel-header">
        <b>Уведомления</b>
      <button id="closeNotifPanel">✕</button>
      </div>
      <div id="notificationsContainer"></div>
    </div>

    <div class="master-profile">
      <img id="masterAvatar" class="avatar" src="">
      <span id="masterNameTop">Мастер</span>
    </div>
    <div class="menu-wrapper">
      <button class="menu-btn" id="menuBtn">☰</button>

      <div class="menu-dropdown" id="menuDropdown">
          <a class="menu-btn-item" href="index.html">Главная</a>
          <a class="menu-btn-item" href="booking.html">Запись клиентам</a>
      <button class="menu-btn-item" id="logoutBtnMenu">Выйти</button>
    </div>
</div>
  </div>
</header>
<div class="master-layout">

  <!-- SIDEBAR -->
  <aside class="master-sidebar">
    <button class="tab-btn side-btn active" data-tab="bookings">Записи</button>
    <button class="tab-btn side-btn" data-tab="schedule">График</button>
    <button class="tab-btn side-btn" data-tab="services">Мои услуги</button>
    <button class="tab-btn side-btn" data-tab="notifications">Уведомления</button>
  </aside>

  <!-- CONTENT -->
  <main class="master-content">
    <!-- BOOKINGS -->
    <section class="tab active" id="bookings">
      <h2>Записи</h2>
      <div class="date-bar">
        <input type="date">
      </div>

      <table class="bookings-table">
        <thead>
          <tr>
            <th>Время</th>
            <th>Имя</th>
            <th>Услуга</th>
            <th>Контакт</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
      </table>

      <div class="summary">
        <div class="summary-card">
          <h3>Сегодня</h3>
          <p id="todayCount">0</p>
        </div>

        <div class="summary-card">
          <h3>Ближайшие</h3>
          <div id="nextBookings"></div>
        </div>
      </div>
    </section>


    <!-- SCHEDULE -->
    <section class="tab" id="schedule">
      <h2>Расписание</h2>
      <div id="scheduleContainer"></div>
    </section>


    <!-- SERVICES -->
    <section class="tab" id="services">
      <h2>Услуги</h2>
      <div id="servicesContainer"></div>
    </section>


    <!-- NOTIFICATIONS -->
    <section class="tab" id="notifications">
      <h2>Уведомления</h2>
      <div id="notificationsContainer"></div>
    </section>
  </main>
</div>
<script type="module" src="firebase.js"></script>
<script type="module" src="panel.js"></script>
</body>
</html>
