<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход мастера</title>
  <link rel="stylesheet" href="style.css">
  </head>
  <style>
   
  </style>
<body data-page="login">
<header class="header">
  <img src="img/лого.png" class="logo">
    <nav>
    <a href="index.html#about">О нас</a>
    <a href="index.html#services">Услуги</a>
    <a href="booking.html">Записаться</a>
    <a href="master-login.html">Кабинет мастера</a>
  </nav>
</header>

  <div class="login-wrapper">

    <h1>Вход в кабинет</h1>
    <form id="loginForm">
      <input type="text" id="login" placeholder="Логин">
    <div class="password-wrapper">
    <input type="password" id="password" placeholder="Пароль">
    <span id="togglePassword" class="eye">👁</span> 
    </div>
      <button type="submit">Войти</button>
      
      <p id="error"></p>
    </form>
  </div>

  <script>
    
console.log("LOGIN PAGE");

const page = document.body?.dataset?.page;

const USERS = {
  tatyana: "architec.color1",
  angelina: "architec.color1",
  anastasia: "architec.color1"
};

// логин панель
if (page === "login") {

  const form = document.getElementById("loginForm");

  form?.addEventListener("submit", (e) => {
    e.preventDefault();

    const login = document.getElementById("login").value.trim().toLowerCase();
    const pass = document.getElementById("password").value.trim();

    if (!login || !pass) return;

    if (USERS[login] === pass) {
      window.location.href = `master-panel.html?master=${login}`;
    } else {
      document.getElementById("error").textContent =
        "Неверный логин или пароль";
    }
  });

  const toggle = document.getElementById("togglePassword");
  const input = document.getElementById("password");

  toggle?.addEventListener("click", () => {
    const hidden = input.type === "password";
    input.type = hidden ? "text" : "password";
    toggle.textContent = hidden ? "⌣" : "👁";
  });
}
  </script>

</body>
</html>
